services:
  web:
    image: nginx:latest # Using the default Nginx image with custom configuration.
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
      # Mount the Nginx configuration file
      - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Map port 80 inside the container to the port specified by 'NGINX_PORT' on the host machine
      - "80:80"
    environment:
      - NGINX_HOST=localhost
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started  # Wait for php-fpm to start

  php-fpm:
    # For the php-fpm service, we will create a custom image to install the necessary PHP extensions and setup proper permissions.
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    env_file:
      # Load the environment variables from the Laravel application
      - ./.env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_started  # Wait for postgres to start

  workspace:
    # For the workspace service, we will also create a custom image to install and setup all the necessary stuff.
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    ports:
      - '${VITE_PORT:-5173}:5173'
    tty: true  # Enables an interactive terminal
    stdin_open: true  # Keeps standard input open for 'docker exec'
    # Планировщик Laravel работает прямо в workspace: `schedule:work` раз в минуту проверяет расписание
    # (routes/console.php). В контейнер по-прежнему можно зайти: docker compose exec workspace bash
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped  # если планировщик упадёт, контейнер поднимется снова
    env_file:
      - ./.env
    volumes:
      - ./:/var/www
    networks:
      - laravel-development

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=laravel
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    networks:
      - laravel-development

  redis:
    image: redis:alpine
    networks:
      - laravel-development

  # Платёжная система (plateshka): отдельное Laravel-приложение, тестовый платёжный шлюз.
  # Основное приложение создаёт платёж по http://payment:8000/api/payments (внутри сети compose),
  # пользователь оплачивает на http://localhost:${PAYMENT_PORT:-8080}/payments/{id}.
  payment:
    build:
      context: ./plateshka
      dockerfile: Dockerfile
    ports:
      - "${PAYMENT_PORT:-8080}:8000"
    environment:
      APP_NAME: Plateshka
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${PAYMENT_PUBLIC_URL:-http://localhost:8080}
      APP_KEY: ${PAYMENT_APP_KEY:-base64:mk/wRdqKw46bI9GM6SGFyyEnoCWbGNSxVIuN0x7hkYU=}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/sqlite/database.sqlite
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      # Код платёжки с хоста: правки routes/views видны без пересборки образа
      - ./plateshka:/var/www
      # vendor остаётся тем, что поставил composer в образе (на хосте его нет)
      - /var/www/vendor
      - payment-data-development:/var/www/database/sqlite
    networks:
      - laravel-development

networks:
  laravel-development:

volumes:
  postgres-data-development:
  payment-data-development:
